  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <div class="label">{{nav_apps}}</div>
        <h1>{{apps_h1_plain}}{{@sp}}<span class="scribble">{{apps_h1_mark}}</span></h1>
        <p class="lead">{{apps_lead}}</p>
      </div>
    </section>

    <div class="wrap">
      <div class="shelf">
        <a class="product" href="{{@root}}/apps/hourwell/">
          <div class="thumb"><img src="/apps/hourwell/feature-{{@shots}}.jpg" alt="{{attr:hw_card_alt}}" width="1024" height="500"></div>
          <div class="body">
            <div class="row">
              <img src="/apps/hourwell/icon-192.png" alt="" width="52" height="52">
              <h2 style="font-size: 32px">Hourwell</h2>
            </div>
            <p>{{hw_card_text}}</p>
            <span class="sticker">{{fl_soon_android}}</span>
          </div>
        </a>
        <div class="placeholder">
          <img src="/assets/brand/hsi-mark.svg" alt="" width="84" height="57">
          <h2 style="font-size: 26px">{{more_title}}</h2>
          <p>{{apps_more_text}}</p>
        </div>
      </div>
    </div>
  </main>
