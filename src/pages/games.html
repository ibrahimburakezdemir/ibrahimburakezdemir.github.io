  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <div class="label">{{nav_games}}</div>
        <h1>{{games_h1_plain}}{{@sp}}<span class="scribble">{{games_h1_mark}}</span></h1>
        <p class="lead">{{games_lead}}</p>
      </div>
    </section>

    <div class="wrap">
      <div class="shelf">
        <a class="product" href="{{@root}}/games/flicklane/">
          <div class="thumb"><img src="/games/flicklane/feature.png" alt="{{attr:fl_card_alt}}" width="1024" height="500"></div>
          <div class="body">
            <div class="row">
              <img src="/games/flicklane/icon-192.png" alt="" width="52" height="52">
              <h2 style="font-size: 32px">Flicklane</h2>
            </div>
            <p>{{fl_card_text}}</p>
            <span class="sticker">{{fl_soon_android}}</span>
          </div>
        </a>
        <div class="placeholder">
          <img src="/assets/brand/hsi-mark.svg" alt="" width="84" height="57">
          <h2 style="font-size: 26px">{{more_title}}</h2>
          <p>{{more_text}}</p>
        </div>
      </div>
    </div>
  </main>
